name: Feature request / 功能建议
description: Suggest a concrete research-diagram workflow improvement.
title: "[Feature]: "
labels: []
body:
  - type: textarea
    id: need
    attributes:
      label: Research workflow / 使用场景
      description: What task are you trying to complete?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior / 希望的功能
      description: Describe an observable result or a small example.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Current workaround / 当前替代方法
