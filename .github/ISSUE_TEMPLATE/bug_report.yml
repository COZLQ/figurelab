name: Bug report / 问题反馈
description: Report a reproducible problem without credentials or private research data.
title: "[Bug]: "
labels: []
body:
  - type: checkboxes
    id: privacy
    attributes:
      label: Before sharing / 提交前
      options:
        - label: I removed API keys and private research content. / 已移除密钥和未公开研究内容。
          required: true
  - type: textarea
    id: problem
    attributes:
      label: What happened? / 出现了什么问题？
      description: Describe the observed behavior and what you expected.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps / 复现步骤
      description: Include a small non-sensitive example if relevant.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment / 使用环境
      placeholder: OS, browser, Node version, local or hosted
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Screenshots or safe logs / 截图或脱敏日志
      description: Check screenshots and logs for credentials before attaching them.
